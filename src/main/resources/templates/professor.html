<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor - Jogo Embaralhar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E72 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #FF6B6B;
            padding-bottom: 20px;
        }
        
        h1 {
            color: #FF6B6B;
            font-size: 2.5rem;
        }
        
        .btn-voltar {
            background-color: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .btn-voltar:hover {
            background-color: #764ba2;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #FF6B6B;
        }
        
        .btn-criar {
            background-color: #FF6B6B;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }
        
        .btn-criar:hover {
            background-color: #FF5252;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        h2 {
            color: #FF6B6B;
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: white;
            border: 2px solid #FF6B6B;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .game-card h3 {
            color: #FF6B6B;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-card p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        
        .btn-detalhes {
            background-color: #4ECDC4;
            color: white;
        }
        
        .btn-desativar {
            background-color: #FF6B6B;
            color: white;
        }
        
        .btn-small:hover {
            opacity: 0.8;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍🏫 Painel do Professor</h1>
            <a href="https://projeto-letramento.vercel.app/dashboard" class="btn-voltar">← Voltar</a>
        </div>

        <div id="alertBox"></div>

        <div class="form-section">
            <h2>Criar Novo Jogo</h2>
            <!-- ✅ ALTERADO: removido method/action do form, agora usa fetch via JS -->
            <div class="form-group">
                <label for="palavra">Palavra</label>
                <input type="text" id="palavra" placeholder="Digite a palavra..." required>
            </div>
            <div class="form-group">
                <label for="imagem">Imagem</label>
                <input type="file" id="imagem" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="dificuldade">Dificuldade</label>
                <select id="dificuldade">
                    <option value="EASY">Fácil - Só embaralha as letras da palavra</option>
                    <option value="HARD">Difícil - Adiciona letras extras embaralhadas</option>
                </select>
            </div>
            <!-- ✅ ALTERADO: button com onclick em vez de submit -->
            <button class="btn-criar" onclick="criarJogo()">Criar Jogo</button>
        </div>

        <h2>Meus Jogos</h2>

        <div id="listaJogos">
            <!-- ✅ ALTERADO: jogos carregados via JS em vez de Thymeleaf -->
            <p class="empty-message">Carregando jogos...</p>
        </div>
    </div>

    <script>
        // ✅ NOVO: URL base do backend centralizada
        const API = 'https://projeto-letramento-production.up.railway.app';

        // ✅ NOVO: carrega jogos via fetch ao abrir a página
        async function carregarJogos() {
            try {
                const response = await fetch(`${API}/embaralhar/professor/jogos`);
                if (!response.ok) throw new Error('Erro ao carregar jogos');
                const jogos = await response.json();
                renderizarJogos(jogos);
            } catch (error) {
                document.getElementById('listaJogos').innerHTML =
                    '<p class="empty-message">Erro ao carregar jogos.</p>';
            }
        }

        function renderizarJogos(jogos) {
            const div = document.getElementById('listaJogos');
            if (!jogos || jogos.length === 0) {
                div.innerHTML = '<p class="empty-message">Nenhum jogo criado ainda. Crie um novo jogo acima!</p>';
                return;
            }
            div.innerHTML = `<div class="games-grid">${jogos.map(jogo => `
                <div class="game-card">
                    <img src="data:image/jpeg;base64,${jogo.imagemBase64}" alt="${jogo.palavra}">
                    <h3>${jogo.palavra.toUpperCase()}</h3>
                    <p>Dificuldade: ${jogo.dificuldade === 'EASY' ? 'Fácil' : 'Difícil'}</p>
                    <p>Criado em: ${jogo.criadoEm}</p>
                    <div class="btn-group">
                        <a href="${API}/embaralhar/professor/detalhes/${jogo.id}" class="btn-small btn-detalhes">Ver Detalhes</a>
                        <button class="btn-small btn-desativar" onclick="desativarJogo(${jogo.id})">Desativar</button>
                    </div>
                </div>`).join('')}
            </div>`;
        }

        // ✅ NOVO: criar jogo via fetch com FormData
        async function criarJogo() {
            const palavra = document.getElementById('palavra').value.trim();
            const imagem = document.getElementById('imagem').files[0];
            const dificuldade = document.getElementById('dificuldade').value;

            if (!palavra) { mostrarAlerta('Por favor, digite uma palavra', 'error'); return; }
            if (!imagem) { mostrarAlerta('Por favor, selecione uma imagem', 'error'); return; }

            const formData = new FormData();
            formData.append('palavra', palavra);
            formData.append('imagem', imagem);
            formData.append('dificuldade', dificuldade);

            try {
                const response = await fetch(`${API}/embaralhar/professor/criar-jogo`, {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) throw new Error('Erro ao criar jogo');
                mostrarAlerta('Jogo criado com sucesso!', 'success');
                document.getElementById('palavra').value = '';
                document.getElementById('imagem').value = '';
                carregarJogos();
            } catch (error) {
                mostrarAlerta('Erro ao criar jogo: ' + error.message, 'error');
            }
        }

        // ✅ NOVO: desativar jogo via fetch
        async function desativarJogo(id) {
            try {
                await fetch(`${API}/embaralhar/professor/desativar/${id}`, { method: 'POST' });
                carregarJogos();
            } catch (error) {
                mostrarAlerta('Erro ao desativar jogo', 'error');
            }
        }

        function mostrarAlerta(mensagem, tipo) {
            const box = document.getElementById('alertBox');
            box.innerHTML = `<div class="alert alert-${tipo === 'success' ? 'success' : 'error'}">${mensagem}</div>`;
            setTimeout(() => box.innerHTML = '', 4000);
        }

        carregarJogos();
    </script>
</body>
</html>
