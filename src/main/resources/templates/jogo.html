<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogar - Jogo Embaralhar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4ECDC4 0%, #44A3A0 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #4ECDC4;
            padding-bottom: 20px;
        }
        
        h1 {
            color: #4ECDC4;
            font-size: 2rem;
        }
        
        .btn-voltar {
            background-color: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .btn-voltar:hover {
            background-color: #764ba2;
        }
        
        .image-container {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .image-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #4ECDC4;
        }
        
        .btn-enviar {
            background-color: #4ECDC4;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }
        
        .btn-enviar:hover {
            background-color: #44A3A0;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .current-answer {
            min-height: 60px;
            padding: 15px;
            border: 2px dashed #4ECDC4;
            border-radius: 10px;
            background: #ffffff;
            color: #333;
            font-size: 1.3rem;
            letter-spacing: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 70px;
        }

        .scrambled-letters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .letter-button {
            padding: 15px 18px;
            border: 2px solid #4ECDC4;
            background: #f8f9fa;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            min-width: 55px;
            text-align: center;
        }

        .letter-button:hover:not(:disabled) {
            transform: translateY(-2px);
            background-color: #e0f7f3;
        }

        .letter-button:disabled,
        .letter-button.used {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-clear {
            flex: 1;
            background-color: #ffffff;
            color: #4ECDC4;
            border: 2px solid #4ECDC4;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-clear:hover:not(:disabled) {
            background-color: #4ECDC4;
            color: white;
        }

        .btn-enviar {
            background-color: #4ECDC4;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s;
            flex: 1;
        }

        .btn-enviar:hover:not(:disabled) {
            background-color: #44A3A0;
        }

        .btn-enviar:disabled,
        .btn-clear:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #4ECDC4;
        }
        
        .result h3 {
            color: #4ECDC4;
            margin-bottom: 10px;
        }
        
        .result p {
            color: #666;
            margin-bottom: 5px;
        }
        
        .celebration {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Adivinhe a Palavra!</h1>
            <a href="/embaralhar/aluno" class="btn-voltar">← Voltar</a>
        </div>
        
        <div class="image-container">
            <img th:src="'data:image/jpeg;base64,' + ${imageBase64}" alt="Imagem do desafio">
        </div>
        
        <div th:if="${mensagem}" class="alert" th:classappend="${sucesso} ? 'alert-success' : 'alert-error'" 
             th:text="${mensagem}"></div>
        
        <div class="form-section">
            <form method="POST" action="/embaralhar/aluno/enviar-resposta">
                <input type="hidden" name="gameId" th:value="${game.id}">
                <input type="hidden" id="resposta" name="resposta" value="">

                <div class="form-group">
                    <label th:if="${game.difficulty != null and game.difficulty.name() == 'EASY'}">Forme a palavra abaixo (use todas as letras disponíveis):</label>
                    <label th:if="${game.difficulty == null or game.difficulty.name() == 'HARD'}">Forme a palavra abaixo (use exatamente <span th:text="${game.word.length()}"></span> letras):</label>
                    <div class="current-answer" id="currentAnswer"></div>
                </div>

                <div class="form-group">
                    <label>Letras embaralhadas</label>
                    <div class="scrambled-letters" id="letterButtons"></div>
                </div>

                <div class="controls">
                    <button type="button" class="btn-clear" id="btnClear" th:disabled="${sucesso}">Limpar</button>
                    <button type="submit" class="btn-enviar" id="btnSubmit" th:disabled="${sucesso}">
                        <span th:if="!${sucesso}">Enviar Resposta</span>
                        <span th:if="${sucesso}">✓ Acertou!</span>
                    </button>
                </div>
            </form>
        </div>
        
        <div th:if="${attempt}" class="result">
            <p><strong>Palavra formada:</strong> <span th:text="${#strings.toUpperCase(attempt.studentAnswer)}"></span></p>
            <p th:if="${sucesso}" style="color: #155724; font-weight: bold;">
                ✓ Parabéns! A resposta correta era: <span th:text="${#strings.toUpperCase(game.word)}"></span>
            </p>
            <p th:if="!${sucesso}" style="color: #721c24; font-weight: bold;">
                ✗ Ainda não! A palavra correta era: <span th:text="${#strings.toUpperCase(game.word)}"></span>
            </p>
            <p style="font-size: 0.9rem; color: #999; margin-top: 10px;" 
               th:text="${'Tentativa em: ' + #temporals.format(attempt.attemptedAt, 'HH:mm:ss')}"></p>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var secretWord = /*[[${game.word}]]*/ '';
        var difficulty = /*[[${game.difficulty != null ? game.difficulty.name() : 'EASY'}]]*/ 'EASY';
        var successMode = /*[[${sucesso} ?: false]]*/ false;
        var letterArray = secretWord.toUpperCase().split('');

        function shuffle(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        function addExtraLetters(letters) {
            var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            var extraLetters = [];
            for (var i = 0; i < 3; i++) {
                var randomLetter = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                extraLetters.push(randomLetter);
            }
            return letters.concat(extraLetters);
        }

        var shuffledLetters = difficulty === 'HARD' ? shuffle(addExtraLetters(letterArray.slice())) : shuffle(letterArray.slice());
        var usedIndexes = [];
        var currentAnswer = '';

        function renderLetters() {
            var container = document.getElementById('letterButtons');
            if (!container) return;
            container.innerHTML = '';

            shuffledLetters.forEach(function(letter, index) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'letter-button';
                button.textContent = letter;
                button.disabled = usedIndexes.indexOf(index) !== -1 || successMode;

                if (usedIndexes.indexOf(index) !== -1) {
                    button.classList.add('used');
                }

                button.addEventListener('click', function() {
                    if (button.disabled) {
                        return;
                    }
                    currentAnswer += letter;
                    usedIndexes.push(index);
                    document.getElementById('resposta').value = currentAnswer;
                    document.getElementById('currentAnswer').textContent = currentAnswer;
                    renderLetters();
                    updateSubmitButton();
                });

                container.appendChild(button);
            });
        }

        function updateSubmitButton() {
            var submitButton = document.getElementById('btnSubmit');
            if (!submitButton) return;
            var requiredLength = difficulty === 'HARD' ? secretWord.length : shuffledLetters.length;
            submitButton.disabled = successMode || currentAnswer.length !== requiredLength;
        }

        function clearSelection() {
            if (successMode) {
                return;
            }
            currentAnswer = '';
            usedIndexes = [];
            document.getElementById('resposta').value = '';
            document.getElementById('currentAnswer').textContent = '';
            renderLetters();
            updateSubmitButton();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderLetters();
            updateSubmitButton();
            var clearButton = document.getElementById('btnClear');
            if (clearButton) {
                clearButton.addEventListener('click', clearSelection);
            }
        });
        /*]]>*/
    </script>
</body>
</html>
